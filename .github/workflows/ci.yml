name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      # No step below needs a key or a network connection, and this workflow has no secrets.
      - name: Generated files are up to date
        run: python scripts/sync_generated.py --check
      - name: Licenses, provenance, content and secrets
        run: python scripts/check_assets.py
      - name: Links in the Markdown files
        run: python scripts/check_links.py
      - name: Mini-test numbers match their table
        run: python scripts/recompute_mini_test.py --check
      - name: The whole pipeline, offline
        run: onmodel bench smoke
      - name: Tests
        run: pytest
