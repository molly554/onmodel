# onmodel benchmark cases, version 1.
#
# bundled: the image is in this repository (CC0 or public domain only).
# linked : the image stays where it is. `onmodel bench fetch` downloads it into bench/.cache/ and refuses a file whose sha256 differs from sha256_source.
#          sha256_saved is what our run of the re-encoding produced; it can differ with your Pillow version and is informational.
# text_gt: the words printed on the real product (upper case, no accents), read by a person. The text rule looks for them in the result.
# Lingerie and swimwear are not part of the public set.

version: 1
cases:

